services:
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: denis
      POSTGRES_DB: default_db
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_HOST: postgres-db
    ports:
      - "8081:8081"

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    environment:
      DB_HOST: postgres-db
      REDIS_HOST: redis-cache
      # ДОДАНО: тепер Feign знайде контейнер за іменем, а не за localhost
      AUTH_HOST: auth-service
    ports:
      - "8082:8082"

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_HOST: postgres-db
      AUTH_HOST: auth-service
      CATALOG_HOST: catalog-service
    ports:
      - "8083:8083"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - auth-service
      - catalog-service
      - order-service
    environment:
      AUTH_HOST: auth-service
      CATALOG_HOST: catalog-service
      ORDER_HOST: order-service
    ports:
      - "8080:8080"