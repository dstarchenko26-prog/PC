apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: denysstarchenko/api-gateway:latest
          imagePullPolicy: IfNotPresent # Обов'язково для локальних образів!
          ports:
            - containerPort: 8080
          env:
            # Беремо хост авторизації з ConfigMap
            - name: AUTH_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: auth-host
            
            # Беремо хост каталогу з ConfigMap
            - name: CATALOG_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: catalog-host
            
            # Беремо хост замовлень з ConfigMap
            - name: ORDER_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: order-host
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer # Дозволяє доступ ззовні кластера
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080